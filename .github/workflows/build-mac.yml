
name: Build Mac Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download game code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Mac game
        run: python -m PyInstaller --onefile CIS_Final_Project/Final_project_Adventure_game.py

      - name: Upload Mac game
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-Game-Mac
          path: dist/Final_project_Adventure_game
